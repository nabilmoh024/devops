apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "canary-demo.fullname" . }}-test-connection"
  labels:
    {{- include "canary-demo.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health-check
      image: busybox:1.36.1
      command:
        - wget
      args:
        - "-q"
        - "-O"
        - "/dev/null"
        - "http://{{ include "canary-demo.fullname" . }}:{{ .Values.service.port }}/health"
