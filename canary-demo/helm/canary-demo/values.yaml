nameOverride: ""
fullnameOverride: ""

image:
  registry: trialbot.jfrog.io
  repository: docker-canary-poc-local/canary-demo
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: jfrog-registry-secret

versions:
  v1:
    enabled: true
    replicaCount: 1
    tag: v1
    appVersion: v1

  v2:
    enabled: true
    replicaCount: 1
    tag: v2
    appVersion: v2

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5

ingress:
  enabled: false

httpRoute:
  enabled: false

autoscaling:
  enabled: false

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
