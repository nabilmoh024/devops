name: Istio Deploy

# Installs, upgrades or removes Istio on the EKS cluster with the official Helm
# charts and the config under istio/. Helm itself and the chart repositories
# come from the same setup as helm.yml (pinned Helm, helm/repos.txt).
# validate never touches AWS. The other actions add this runner's IP to the
# cluster API allow-list and always restore the original list at the end.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        type: choice
        options:
          - validate
          - install
          - status
          - uninstall
        default: validate
      version:
        description: Istio version (change it to upgrade)
        type: string
        default: "1.30.6"
      install_gateway:
        description: Also install the ingress gateway
        type: boolean
        default: false
      inject_namespace:
        description: Optional namespace to label istio-injection=enabled
        type: string
        default: ""

permissions:
  contents: read # required for checkout

# Same group as terraform.yml (eks / dev): an Istio run never changes the
# cluster at the same time as a Terraform, Helm or scale run.
concurrency:
  group: terraform-eks-dev
  cancel-in-progress: false

env:
  CLUSTER: devops-dev-eks
  HELM_VERSION: v4.3.1
  ISTIO_VERSION: ${{ inputs.version }}
  INSTALL_GATEWAY: ${{ inputs.install_gateway }}
  INJECT_NS: ${{ inputs.inject_namespace }}

jobs:
  istio:
    name: ${{ inputs.action }} istio ${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check inputs
        run: |
          set -euo pipefail
          V="${ISTIO_VERSION//[[:space:]]/}"
          NS="${INJECT_NS//[[:space:]]/}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like 1.30.6 (got '$ISTIO_VERSION')"; exit 1
          fi
          if [ -n "$NS" ]; then
            if [ "${#NS}" -gt 63 ] || ! [[ "$NS" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]; then
              echo "::error::inject_namespace '$INJECT_NS' is not a valid namespace name (lowercase letters, digits and dashes only)"; exit 1
            fi
          fi
          # Use the cleaned values (no stray spaces) in the later steps
          { echo "ISTIO_VERSION=$V"; echo "INJECT_NS=$NS"; } >> "$GITHUB_ENV"

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Show Helm version
        run: helm version

      - name: Add Helm repositories
        run: |
          set -euo pipefail
          FILE=helm/repos.txt
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found"; exit 1
          fi
          COUNT=0
          while read -r name url extra; do
            case "$name" in ''|'#'*) continue ;; esac
            if [ -z "$url" ] || [ -n "$extra" ]; then
              echo "::error::Bad line in $FILE for '$name': expected '<name> <https-url>'"; exit 1
            fi
            case "$url" in
              https://*) ;;
              *) echo "::error::Repository '$name' must use an https:// URL"; exit 1 ;;
            esac
            helm repo add "$name" "$url" --force-update
            COUNT=$((COUNT + 1))
          done < "$FILE"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No repositories found in $FILE"; exit 1
          fi
          helm repo update

      - name: Check the Istio chart version exists
        run: |
          set -euo pipefail
          for c in base istiod gateway; do
            OUT="$(helm search repo "istio/$c" --version "$ISTIO_VERSION" || true)"
            if ! grep -q "^istio/$c[[:space:]]" <<< "$OUT"; then
              NAMES="$(helm search repo istio/ | awk 'NR > 1 {print $1}' | paste -sd, -)"
              VERS="$(helm search repo "istio/$c" --versions | awk 'NR > 1 && NR <= 6 {print $2}' | paste -sd, -)"
              echo "::error::Chart istio/$c $ISTIO_VERSION was not found. Charts in the repo: [${NAMES:-none}]. Newest versions of istio/$c: [${VERS:-none}]."
              exit 1
            fi
            echo "Found istio/$c $ISTIO_VERSION"
          done

      - name: Render istio-base
        run: helm template istio-base istio/base --version "$ISTIO_VERSION" --namespace istio-system > /dev/null

      - name: Render istiod
        run: helm template istiod istio/istiod --version "$ISTIO_VERSION" --namespace istio-system -f istio/istiod-values.yaml > /dev/null

      - name: Render ingress gateway
        run: helm template istio-ingress istio/gateway --version "$ISTIO_VERSION" --namespace istio-ingress -f istio/gateway-values.yaml > /dev/null

      - name: Check Istio manifests
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, re, sys
          try:
              import yaml
          except ImportError:
              yaml = None
          files = sorted(glob.glob("istio/manifests/*.y*ml"))
          if not files:
              sys.exit("No manifests found under istio/manifests/")
          for f in files:
              text = open(f).read()
              if yaml:
                  docs = [d for d in yaml.safe_load_all(text) if d]
                  for d in docs:
                      for key in ("apiVersion", "kind", "metadata"):
                          if key not in d:
                              sys.exit(f"{f}: missing {key}")
              else:
                  docs = [p for p in re.split(r"^---\s*$", text, flags=re.M) if re.search(r"^\w", p, re.M)]
                  for p in docs:
                      for key in ("apiVersion", "kind", "metadata"):
                          if not re.search(rf"^{key}:", p, re.M):
                              sys.exit(f"{f}: missing {key}")
              print(f"{f}: {len(docs)} document(s) OK")
          EOF

      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.action != 'validate'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Allow this runner to reach the EKS API
        if: inputs.action != 'validate'
        run: |
          set -euo pipefail
          wait_update() {
            local s
            for _ in $(seq 1 60); do
              s="$(aws eks describe-update --name "$CLUSTER" --update-id "$1" --query 'update.status' --output text)"
              case "$s" in
                Successful) return 0 ;;
                Failed|Cancelled) echo "::error::Cluster update $s"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error::Timed out waiting for the cluster update"; return 1
          }
          MYIP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')/32"
          ORIG="$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',')"
          for c in ${ORIG//,/ }; do echo "::add-mask::$c"; done
          echo "ORIG_CIDRS=$ORIG" >> "$GITHUB_ENV"
          case ",$ORIG," in
            *",$MYIP,"*|*",0.0.0.0/0,"*) echo "Runner already allowed, no change needed" ;;
            *)
              UPD="$(aws eks update-cluster-config --name "$CLUSTER" --resources-vpc-config "publicAccessCidrs=$ORIG,$MYIP" --query 'update.id' --output text)"
              wait_update "$UPD"
              ;;
          esac

      - name: Connect to the cluster
        if: inputs.action != 'validate'
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" > /dev/null
          for i in $(seq 1 12); do
            if helm list --namespace kube-system > /dev/null 2>&1; then
              echo "Cluster API reachable"; exit 0
            fi
            echo "Waiting for the API (attempt $i)"; sleep 10
          done
          echo "::error::Could not reach the EKS API"; exit 1

      - name: Check the cluster has nodes
        if: inputs.action == 'install'
        run: |
          set -euo pipefail
          READY="$(kubectl get nodes --no-headers | awk '$2 == "Ready"' | wc -l)"
          echo "Ready nodes: $READY"
          if [ "$READY" -lt 1 ]; then
            echo "::error::No Ready nodes. Run the EKS Scale Nodes workflow first (1 or 2 nodes), then run this again."
            exit 1
          fi

      - name: Install istio-base (CRDs)
        if: inputs.action == 'install'
        run: |
          helm upgrade --install istio-base istio/base \
            --version "$ISTIO_VERSION" \
            --namespace istio-system --create-namespace \
            --rollback-on-failure --timeout 5m

      - name: Install istiod (control plane)
        if: inputs.action == 'install'
        run: |
          helm upgrade --install istiod istio/istiod \
            --version "$ISTIO_VERSION" \
            --namespace istio-system \
            -f istio/istiod-values.yaml \
            --rollback-on-failure --timeout 10m
          kubectl -n istio-system rollout status deployment/istiod --timeout=5m

      - name: Install the ingress gateway
        if: inputs.action == 'install' && inputs.install_gateway
        run: |
          helm upgrade --install istio-ingress istio/gateway \
            --version "$ISTIO_VERSION" \
            --namespace istio-ingress --create-namespace \
            -f istio/gateway-values.yaml \
            --rollback-on-failure --timeout 5m

      - name: Apply Istio manifests
        if: inputs.action == 'install'
        run: kubectl apply -f istio/manifests/

      - name: Enable sidecar injection
        if: inputs.action == 'install' && env.INJECT_NS != ''
        run: |
          set -euo pipefail
          case "$INJECT_NS" in
            kube-system|kube-public|kube-node-lease|istio-system)
              echo "::error::Refusing to enable injection in $INJECT_NS"; exit 1 ;;
          esac
          kubectl create namespace "$INJECT_NS" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$INJECT_NS" istio-injection=enabled --overwrite
          echo "Only pods created from now on get a sidecar. For existing workloads run: kubectl rollout restart deployment -n $INJECT_NS"

      - name: Uninstall Istio
        if: inputs.action == 'uninstall'
        run: |
          set -euo pipefail
          kubectl delete -f istio/manifests/ --ignore-not-found
          for r in istio-ingress:istio-ingress istiod:istio-system istio-base:istio-system; do
            name="${r%%:*}"; ns="${r##*:}"
            if helm status "$name" --namespace "$ns" > /dev/null 2>&1; then
              helm uninstall "$name" --namespace "$ns"
            else
              echo "$name is not installed, skipping"
            fi
          done
          echo "The *.istio.io CRDs are not removed by Helm and stay in the cluster."

      - name: Show Istio status
        if: inputs.action != 'validate'
        run: |
          helm list --all-namespaces | grep -E 'NAME|istio' || true
          kubectl get pods --namespace istio-system || true
          kubectl get pods --namespace istio-ingress || true

      - name: Restore the original API allow-list
        if: always() && env.ORIG_CIDRS != ''
        run: |
          set -euo pipefail
          wait_update() {
            local s
            for _ in $(seq 1 60); do
              s="$(aws eks describe-update --name "$CLUSTER" --update-id "$1" --query 'update.status' --output text)"
              case "$s" in
                Successful) return 0 ;;
                Failed|Cancelled) echo "::error::Cluster update $s"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error::Timed out waiting for the cluster update"; return 1
          }
          norm() { tr ',' '\n' | sort | paste -sd, -; }
          CUR="$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',' | norm)"
          WANT="$(printf '%s' "$ORIG_CIDRS" | norm)"
          if [ "$CUR" = "$WANT" ]; then
            echo "Allow-list already original"; exit 0
          fi
          UPD="$(aws eks update-cluster-config --name "$CLUSTER" --resources-vpc-config "publicAccessCidrs=$ORIG_CIDRS" --query 'update.id' --output text)"
          wait_update "$UPD"
          echo "Allow-list restored"
