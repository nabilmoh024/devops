name: Helm Deploy

# Installs Helm, registers the chart repositories listed in helm/repos.txt, and
# deploys the charts under helm/ to the EKS cluster by hand.
# repos, lint and template never touch AWS. upgrade-install and uninstall add
# this runner's IP to the cluster API allow-list and always restore the
# original list at the end.

on:
  workflow_dispatch:
    inputs:
      action:
        description: Helm action
        type: choice
        options:
          - repos
          - lint
          - template
          - upgrade-install
          - uninstall
        default: repos
      chart:
        description: Chart folder under helm/ (ignored by repos)
        type: choice
        options:
          - test-release
          - webapp
        default: test-release
      namespace:
        description: Kubernetes namespace for the release (ignored by repos)
        type: string
        default: test
      values_file:
        description: Optional values file inside the chart folder (for example values-internet.yaml)
        type: string
        default: ""

permissions:
  contents: read # required for checkout

# Same group as terraform.yml (eks / dev): a Helm run and a Terraform run
# never change the cluster at the same time.
concurrency:
  group: terraform-eks-dev
  cancel-in-progress: false

env:
  CLUSTER: devops-dev-eks
  HELM_VERSION: v4.3.1
  CHART: ${{ inputs.chart }}
  NAMESPACE: ${{ inputs.namespace }}
  VALUES_FILE: ${{ inputs.values_file }}

jobs:
  helm:
    name: helm ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Show Helm version
        run: helm version

      - name: Add Helm repositories
        run: |
          set -euo pipefail
          FILE=helm/repos.txt
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE not found"; exit 1
          fi
          COUNT=0
          while read -r name url extra; do
            case "$name" in ''|'#'*) continue ;; esac
            if [ -z "$url" ] || [ -n "$extra" ]; then
              echo "::error::Bad line in $FILE for '$name': expected '<name> <https-url>'"; exit 1
            fi
            case "$url" in
              https://*) ;;
              *) echo "::error::Repository '$name' must use an https:// URL"; exit 1 ;;
            esac
            helm repo add "$name" "$url" --force-update
            COUNT=$((COUNT + 1))
          done < "$FILE"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No repositories found in $FILE"; exit 1
          fi
          helm repo update

      - name: Verify the repositories
        if: inputs.action == 'repos'
        run: |
          set -euo pipefail
          helm repo list
          while read -r name url _; do
            case "$name" in ''|'#'*) continue ;; esac
            OUT="$(helm search repo "$name/")"
            N="$(printf '%s\n' "$OUT" | tail -n +2 | wc -l)"
            echo "== $name: $N chart(s)"
            if [ "$N" -lt 1 ]; then
              echo "::error::No charts found in repository '$name'"; exit 1
            fi
            printf '%s\n' "$OUT" | sed -n '1,15p'
          done < helm/repos.txt

      - name: Lint chart
        if: inputs.action != 'repos'
        run: helm lint "helm/$CHART" ${VALUES_FILE:+-f "helm/$CHART/$VALUES_FILE"}

      - name: Render chart
        if: inputs.action == 'template'
        run: helm template "$CHART" "helm/$CHART" --namespace "$NAMESPACE" ${VALUES_FILE:+-f "helm/$CHART/$VALUES_FILE"}

      - uses: aws-actions/configure-aws-credentials@v6
        if: inputs.action == 'upgrade-install' || inputs.action == 'uninstall'
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Allow this runner to reach the EKS API
        if: inputs.action == 'upgrade-install' || inputs.action == 'uninstall'
        run: |
          set -euo pipefail
          wait_update() {
            local s
            for _ in $(seq 1 60); do
              s="$(aws eks describe-update --name "$CLUSTER" --update-id "$1" --query 'update.status' --output text)"
              case "$s" in
                Successful) return 0 ;;
                Failed|Cancelled) echo "::error::Cluster update $s"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error::Timed out waiting for the cluster update"; return 1
          }
          MYIP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')/32"
          ORIG="$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',')"
          for c in ${ORIG//,/ }; do echo "::add-mask::$c"; done
          echo "ORIG_CIDRS=$ORIG" >> "$GITHUB_ENV"
          case ",$ORIG," in
            *",$MYIP,"*|*",0.0.0.0/0,"*) echo "Runner already allowed, no change needed" ;;
            *)
              UPD="$(aws eks update-cluster-config --name "$CLUSTER" --resources-vpc-config "publicAccessCidrs=$ORIG,$MYIP" --query 'update.id' --output text)"
              wait_update "$UPD"
              ;;
          esac

      - name: Connect to the cluster
        if: inputs.action == 'upgrade-install' || inputs.action == 'uninstall'
        run: |
          aws eks update-kubeconfig --name "$CLUSTER" > /dev/null
          for i in $(seq 1 12); do
            if helm list --namespace kube-system > /dev/null 2>&1; then
              echo "Cluster API reachable"; exit 0
            fi
            echo "Waiting for the API (attempt $i)"; sleep 10
          done
          echo "::error::Could not reach the EKS API"; exit 1

      - name: Helm upgrade --install
        if: inputs.action == 'upgrade-install'
        run: |
          helm upgrade --install "$CHART" "helm/$CHART" --namespace "$NAMESPACE" --create-namespace --rollback-on-failure --timeout 5m ${VALUES_FILE:+-f "helm/$CHART/$VALUES_FILE"}
          helm status "$CHART" --namespace "$NAMESPACE"

      - name: Helm uninstall
        if: inputs.action == 'uninstall'
        run: helm uninstall "$CHART" --namespace "$NAMESPACE"

      - name: Show releases
        if: inputs.action == 'upgrade-install' || inputs.action == 'uninstall'
        run: helm list --namespace "$NAMESPACE"

      - name: Restore the original API allow-list
        if: always() && env.ORIG_CIDRS != ''
        run: |
          set -euo pipefail
          wait_update() {
            local s
            for _ in $(seq 1 60); do
              s="$(aws eks describe-update --name "$CLUSTER" --update-id "$1" --query 'update.status' --output text)"
              case "$s" in
                Successful) return 0 ;;
                Failed|Cancelled) echo "::error::Cluster update $s"; return 1 ;;
              esac
              sleep 15
            done
            echo "::error::Timed out waiting for the cluster update"; return 1
          }
          norm() { tr ',' '\n' | sort | paste -sd, -; }
          CUR="$(aws eks describe-cluster --name "$CLUSTER" --query 'cluster.resourcesVpcConfig.publicAccessCidrs' --output text | tr '\t' ',' | norm)"
          WANT="$(printf '%s' "$ORIG_CIDRS" | norm)"
          if [ "$CUR" = "$WANT" ]; then
            echo "Allow-list already original"; exit 0
          fi
          UPD="$(aws eks update-cluster-config --name "$CLUSTER" --resources-vpc-config "publicAccessCidrs=$ORIG_CIDRS" --query 'update.id' --output text)"
          wait_update "$UPD"
          echo "Allow-list restored"
