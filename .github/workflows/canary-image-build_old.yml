
name: Canary Image Build and Publish

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-image-publish
  cancel-in-progress: false

env:
  JFROG_REGISTRY: trialbot.jfrog.io
  DOCKER_REPOSITORY: docker-canary-poc-local
  IMAGE_NAME: canary-demo

jobs:
  build-and-push:
    name: Build and publish Canary images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to JFrog
        uses: docker/login-action@v3
        with:
          registry: ${{ env.JFROG_REGISTRY }}
          username: ${{ secrets.JFROG_USERNAME }}
          password: ${{ secrets.JFROG_ACCESS_TOKEN }}

      - name: Build and push v1
        uses: docker/build-push-action@v6
        id: build-v1
        with:
          context: ./canary-demo
          file: ./canary-demo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.JFROG_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:v1
          provenance: mode=min

      - name: Build and push v2
        uses: docker/build-push-action@v6
        id: build-v2
        with:
          context: ./canary-demo
          file: ./canary-demo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.JFROG_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.IMAGE_NAME }}:v2
          provenance: mode=min

      - name: Show published image digests
        env:
          V1_DIGEST: ${{ steps.build-v1.outputs.digest }}
          V2_DIGEST: ${{ steps.build-v2.outputs.digest }}
        run: |
          set -euo pipefail

          echo "Published image v1:"
          echo "$JFROG_REGISTRY/$DOCKER_REPOSITORY/$IMAGE_NAME@${V1_DIGEST}"

          echo "Published image v2:"
          echo "$JFROG_REGISTRY/$DOCKER_REPOSITORY/$IMAGE_NAME@${V2_DIGEST}"

          {
            echo "## JFrog Canary Image Build"
            echo ""
            echo "| Version | Digest |"
            echo "|---|---|"
            echo "| v1 | \`${V1_DIGEST}\` |"
            echo "| v2 | \`${V2_DIGEST}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
