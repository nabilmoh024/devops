name: Canary POC - Post EKS Deployment

on:
  workflow_dispatch:
    inputs:
      chart_version:
        description: 'Published JFrog Helm chart version'
        required: true
        type: string
        default: '0.1.1'
      v2_weight:
        description: 'Percentage of mesh traffic sent to v2 (0-100)'
        required: true
        type: number
        default: 10

permissions:
  contents: read

concurrency:
  group: canary-poc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feature-canary-demo'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AWS_REGION: ap-south-1
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      NAMESPACE: canary-demo
      CHART_VERSION: ${{ inputs.chart_version }}
      V2_WEIGHT: ${{ inputs.v2_weight }}
      JFROG_HOST: trialbot.jfrog.io
      CHART_REF: oci://trialbot.jfrog.io/helm-canary-poc-local/canary-demo

    steps:
      - name: Check out selected feature branch
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$EKS_CLUSTER_NAME" || { echo 'Missing repository variable EKS_CLUSTER_NAME'; exit 1; }
          [[ "$CHART_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid chart version'; exit 1; }
          [[ "$V2_WEIGHT" =~ ^[0-9]+$ ]] && (( V2_WEIGHT >= 0 && V2_WEIGHT <= 100 )) || { echo 'v2_weight must be 0..100'; exit 1; }
          echo "V1_WEIGHT=$((100 - V2_WEIGHT))" >> "$GITHUB_ENV"

      - name: Configure existing AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Connect to existing EKS
        shell: bash
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"
          kubectl get nodes
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      - name: Install or upgrade Vault Secrets Operator
        shell: bash
        run: |
          set -euo pipefail
          helm repo add hashicorp https://helm.releases.hashicorp.com --force-update
          helm repo update hashicorp
          helm upgrade --install vault-secrets-operator hashicorp/vault-secrets-operator \
            --namespace vault-secrets-operator-system --create-namespace \
            --set controller.replicas=1 --wait --timeout 8m

      - name: Reconcile existing HCP Vault connection and auth
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: secrets.hashicorp.com/v1beta1
          kind: VaultConnection
          metadata:
            name: hcp-vault
          spec:
            address: https://vault-cluster-public-vault-ee2ad25b.d032a100.z1.hashicorp.cloud:8200
            skipTLSVerify: false
          ---
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: vault-secrets-operator
          ---
          apiVersion: secrets.hashicorp.com/v1beta1
          kind: VaultAuth
          metadata:
            name: hcp-vault-auth
          spec:
            vaultConnectionRef: hcp-vault
            namespace: admin
            method: jwt
            mount: jwt-eks
            jwt:
              role: eks-jfrog-role
              serviceAccount: vault-secrets-operator
              audiences:
                - vault
          EOF

      - name: Synchronize Vault-managed JFrog image-pull secret
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: secrets.hashicorp.com/v1beta1
          kind: VaultStaticSecret
          metadata:
            name: jfrog-registry
          spec:
            vaultAuthRef: hcp-vault-auth
            mount: kv
            type: kv-v2
            path: jfrog/registry
            refreshAfter: 1h
            destination:
              create: true
              name: jfrog-registry-secret
              type: kubernetes.io/dockerconfigjson
              transformation:
                excludeRaw: true
                excludes:
                  - token
                  - username
                templates:
                  .dockerconfigjson:
                    text: |
                      {
                        "auths": {
                          "trialbot.jfrog.io": {
                            "username": {{ .Secrets.username | toJson }},
                            "password": {{ .Secrets.token | toJson }},
                            "auth": {{ printf "%s:%s" .Secrets.username .Secrets.token | b64enc | toJson }}
                          }
                        }
                      }
          EOF
          for i in $(seq 1 40); do
            if kubectl get secret jfrog-registry-secret -n "$NAMESPACE" -o jsonpath='{.type}' 2>/dev/null | grep -qx 'kubernetes.io/dockerconfigjson'; then
              echo 'Vault-managed image-pull secret exists'; break
            fi
            if [ "$i" -eq 40 ]; then echo 'Timed out waiting for VSO secret'; exit 1; fi
            sleep 10
          done
          keys="$(kubectl get secret jfrog-registry-secret -n "$NAMESPACE" -o go-template='{{range $k, $v := .data}}{{printf "%s " $k}}{{end}}')"
          test "$keys" = '.dockerconfigjson ' || { echo 'Unexpected image-pull secret keys'; exit 1; }

      - name: Install or upgrade Istio base and control plane
        shell: bash
        run: |
          set -euo pipefail
          helm repo add istio https://istio-release.storage.googleapis.com/charts --force-update
          helm repo update istio
          helm upgrade --install istio-base istio/base \
            --namespace istio-system --create-namespace \
            --set defaultRevision=default --wait --timeout 8m
          helm upgrade --install istiod istio/istiod \
            --namespace istio-system \
            --set pilot.resources.requests.cpu=100m \
            --set pilot.resources.requests.memory=256Mi \
            --set pilot.resources.limits.memory=1Gi \
            --wait --timeout 8m
          kubectl rollout status deployment/istiod -n istio-system --timeout=180s

      - name: Authenticate Helm to JFrog OCI
        shell: bash
        env:
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_ACCESS_TOKEN: ${{ secrets.JFROG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$JFROG_USERNAME" && test -n "$JFROG_ACCESS_TOKEN" || { echo 'JFrog GitHub secrets missing'; exit 1; }
          printf '%s' "$JFROG_ACCESS_TOKEN" | helm registry login "$JFROG_HOST" --username "$JFROG_USERNAME" --password-stdin

      - name: Deploy existing chart with Envoy injection enabled
        shell: bash
        run: |
          set -euo pipefail
          kubectl label namespace "$NAMESPACE" istio-injection=enabled --overwrite
          helm upgrade --install canary-demo "$CHART_REF" \
            --version "$CHART_VERSION" --namespace "$NAMESPACE" --wait --timeout 8m
          # Recreate existing Pods if they predate sidecar injection.
          kubectl rollout restart deployment/canary-demo-v1 deployment/canary-demo-v2 -n "$NAMESPACE"
          kubectl rollout status deployment/canary-demo-v1 -n "$NAMESPACE" --timeout=240s
          kubectl rollout status deployment/canary-demo-v2 -n "$NAMESPACE" --timeout=240s

      - name: Apply Istio subset and weighted routing rules
        shell: bash
        run: |
          set -euo pipefail
          cat <<'EOF' | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: networking.istio.io/v1
          kind: DestinationRule
          metadata:
            name: canary-demo
          spec:
            host: canary-demo.canary-demo.svc.cluster.local
            subsets:
              - name: v1
                labels:
                  version: v1
              - name: v2
                labels:
                  version: v2
          EOF
          cat <<EOF | kubectl apply -n "$NAMESPACE" -f -
          apiVersion: networking.istio.io/v1
          kind: VirtualService
          metadata:
            name: canary-demo
          spec:
            hosts:
              - canary-demo.canary-demo.svc.cluster.local
            http:
              - route:
                  - destination:
                      host: canary-demo.canary-demo.svc.cluster.local
                      subset: v1
                    weight: ${V1_WEIGHT}
                  - destination:
                      host: canary-demo.canary-demo.svc.cluster.local
                      subset: v2
                    weight: ${V2_WEIGHT}
          EOF

      - name: Verify injected Pods and exercise canary routing
        shell: bash
        run: |
          set -euo pipefail
          kubectl get pods -n "$NAMESPACE"
          for d in canary-demo-v1 canary-demo-v2; do
            containers="$(kubectl get deployment "$d" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[*].name}')"
            [[ "$containers" == *istio-proxy* ]] || { echo "No Istio sidecar in $d"; exit 1; }
          done
          kubectl exec -n "$NAMESPACE" deployment/canary-demo-v1 -c canary-demo -- python -c '
          import collections, json, urllib.request
          counts=collections.Counter()
          url="http://canary-demo.canary-demo.svc.cluster.local/"
          for _ in range(100):
              with urllib.request.urlopen(url, timeout=5) as response:
                  counts[json.load(response)["version"]] += 1
          print("Observed 100 requests:", dict(counts))
          assert sum(counts.values()) == 100
          if int("${{ inputs.v2_weight }}") > 0: assert counts["v2"] > 0
          if int("${{ inputs.v2_weight }}") < 100: assert counts["v1"] > 0
          '
          echo 'Canary deployment and basic routing checks completed.'
